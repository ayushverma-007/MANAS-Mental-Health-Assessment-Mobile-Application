<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Your Growth Tracking</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#8BC34A",
        secondary: "#AED581",
        accent: "#5D4037",
        "background-light": "#E8F5E9",
        "background-dark": "#1B2E21",
        "surface-light": "#FFFFFF",
        "surface-dark": "#2C4A34",
        // only needed for bottom nav, safe to add
        navInactive: "#6B7280",
        navActive: "#AED581"
      },
      fontFamily: {
        display: ["Playfair Display", "serif"],
        sans: ["Nunito", "sans-serif"],
      },
      borderRadius: {
        DEFAULT: "1rem",
        xl: "1.5rem",
        '2xl': "2rem",
      },
      boxShadow: {
        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
        'glow': '0 0 15px rgba(139, 195, 74, 0.3)',
      }
    },
  },
};
</script>

<style>
.plant-stage { transition: all 0.3s ease-in-out; }
.plant-stage:hover { transform: translateY(-5px); }

body { min-height: max(884px, 100dvh); }

/* allow scroll only when needed (mobile/tablet mode) */
html, body { overflow-y: auto; }
</style>

</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen font-sans transition-colors duration-300 antialiased relative">

<!-- TOP BAR (added home icon only, no other changes) -->
<div class="fixed top-0 w-full z-10 px-6 pt-12 pb-4 flex justify-between items-center bg-transparent">

  <button class="p-2 rounded-full bg-surface-light/50 dark:bg-surface-dark/50 
                 backdrop-blur-sm text-gray-700 dark:text-gray-200 hover:bg-white 
                 dark:hover:bg-surface-dark transition shadow-sm">
    <span class="material-icons-round text-xl">arrow_back</span>
  </button>

  <!-- ⭐ HOME BUTTON ADDED -->
  <a href="home.html"
     class="p-2 rounded-full bg-surface-light/50 dark:bg-surface-dark/50 
            backdrop-blur-sm text-gray-700 dark:text-gray-200 hover:bg-white 
            dark:hover:bg-surface-dark transition shadow-sm">
    <span class="material-symbols-outlined text-xl">home</span>
  </a>

</div>

<!-- MAIN CONTENT (100% ORIGINAL) -->
<main class="flex flex-col items-center justify-center min-h-screen px-6 w-full max-w-md mx-auto pt-20 pb-32">

<div class="text-center mb-12 animate-fade-in-down">
  <h1 class="font-display text-4xl md:text-5xl font-bold text-gray-800 dark:text-white mb-4 tracking-tight">
    Your Growth
  </h1>
  <p class="text-lg text-gray-600 dark:text-gray-300 font-medium max-w-xs mx-auto leading-relaxed">
    Keep going, you’re growing well!
  </p>
</div>

<div class="w-full relative mb-12">
  <div class="absolute bottom-4 left-0 right-0 h-3 bg-[#FFE0B2] dark:bg-[#5D4037] opacity-60 rounded-full blur-[1px]"></div>

  <div class="flex justify-between items-end relative z-10 px-2">

    <!-- Stage 1 -->
    <div class="flex flex-col items-center plant-stage group cursor-pointer">
      <div class="opacity-0 group-hover:opacity-100 absolute -top-12 transition-opacity bg-white dark:bg-surface-dark px-2 py-1 rounded text-xs shadow-soft text-gray-600 dark:text-gray-200 whitespace-nowrap mb-2">Started</div>
      <div class="w-12 h-16 flex items-end justify-center pb-1">
        <svg fill="none" height="24" viewBox="0 0 24 24" width="24">
          <path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21Z" fill="#5D4037" stroke="#3E2723" stroke-width="1.5"/>
          <path d="M10 8C10 8 13 10 13 14" stroke="#8D6E63" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Stage 2 -->
    <div class="flex flex-col items-center plant-stage group cursor-pointer">
      <div class="w-16 h-20 flex items-end justify-center relative">
        <div class="absolute bottom-0 w-8 h-3 bg-[#5D4037] rounded-t-full"></div>
        <svg class="relative z-10 mb-1" fill="none" height="32" viewBox="0 0 24 24" width="32">
          <path d="M12 20V12" stroke="#689F38" stroke-linecap="round" stroke-width="2.5"/>
          <path d="M12 14C12 14 8 13 6 10C4 7 5 5 7 5C9 5 12 10 12 14Z" fill="#8BC34A" stroke="#689F38" stroke-linejoin="round" stroke-width="1.5"/>
          <path d="M12 14C12 14 16 13 18 10C20 7 19 5 17 5C15 5 12 10 12 14Z" fill="#8BC34A" stroke="#689F38" stroke-linejoin="round" stroke-width="1.5"/>
        </svg>
      </div>
    </div>

    <!-- Stage 3 -->
    <div class="flex flex-col items-center plant-stage group cursor-pointer">
      <div class="w-20 h-28 flex items-end justify-center relative">
        <div class="absolute bottom-0 w-10 h-4 bg-[#5D4037] rounded-t-full"></div>
        <svg class="relative z-10 mb-1" fill="none" height="48" viewBox="0 0 48 48" width="48">
          <path d="M24 44V20" stroke="#689F38" stroke-linecap="round" stroke-width="3"/>
          <path d="M24 28C24 28 14 26 10 18C6 10 9 6 14 6C19 6 24 20 24 28Z" fill="#8BC34A" stroke="#689F38" stroke-linejoin="round" stroke-width="2"/>
          <path d="M24 28C24 28 34 26 38 18C42 10 39 6 34 6C29 6 24 20 24 28Z" fill="#8BC34A" stroke="#689F38" stroke-linejoin="round" stroke-width="2"/>
          <path d="M24 38C24 38 18 37 17 34" stroke="#689F38" stroke-linecap="round" stroke-width="2"/>
          <path d="M24 34C24 34 28 33 29 30" stroke="#689F38" stroke-linecap="round" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <!-- Stage 4 Active -->
    <div class="flex flex-col items-center plant-stage group cursor-pointer">
      <div class="opacity-0 group-hover:opacity-100 absolute -top-6 transition-opacity bg-primary text-white px-3 py-1 rounded-full text-xs shadow-glow whitespace-nowrap mb-2 font-bold z-20">
        You are here!
      </div>

      <div class="w-24 h-40 flex items-end justify-center relative">
        <div class="absolute bottom-0 w-14 h-5 bg-[#5D4037] rounded-t-full"></div>

        <svg class="relative z-10 mb-1 transform origin-bottom animate-[sway_3s_ease-in-out_infinite]"
             fill="none" height="80" viewBox="0 0 64 64" width="80">

          <style>
          @keyframes sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
          }
          </style>

          <path d="M32 60V25" stroke="#689F38" stroke-linecap="round" stroke-width="3.5"/>
          <path d="M32 38C32 38 15 35 8 20C1 5 8 2 18 2C27 2 32 25 32 38Z" fill="#9CCC65" stroke="#689F38" stroke-linejoin="round" stroke-width="2"/>
          <path d="M32 38C32 38 49 35 56 20C63 5 56 2 46 2C37 2 32 25 32 38Z" fill="#8BC34A" stroke="#689F38" stroke-linejoin="round" stroke-width="2"/>
          <path d="M32 50C32 50 25 48 22 42C19 36 21 34 24 34C27 34 32 45 32 50Z" fill="#7CB342" stroke="#558B2F" stroke-linejoin="round" stroke-width="1.5"/>
          <path d="M32 45C32 45 40 43 42 38C44 33 42 31 39 31C36 31 32 40 32 45Z" fill="#7CB342" stroke="#558B2F" stroke-linejoin="round" stroke-width="1.5"/>
        </svg>

      </div>
    </div>

  </div>
</div>


<div class="w-full mt-8 bg-surface-light dark:bg-surface-dark p-6 rounded-2xl shadow-soft dark:shadow-none border border-white/50 dark:border-white/10 backdrop-blur-md">

  <h3 class="text-sm uppercase tracking-wider text-gray-400 dark:text-gray-500 font-bold mb-6 text-center">
    Weekly Progress
  </h3>

  <div class="relative w-full px-2">

    <div class="absolute top-[14px] left-0 w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
    <div class="absolute top-[14px] left-0 w-[55%] h-2 bg-gradient-to-r from-secondary to-primary rounded-full shadow-glow"></div>

    <div class="flex justify-between items-start relative z-10">

      <div class="flex flex-col items-center gap-2 group cursor-pointer">
        <div class="w-9 h-9 rounded-full bg-secondary border-4 border-white dark:border-surface-dark flex items-center justify-center shadow-md group-hover:scale-110 transition">
          <span class="material-icons-round text-white text-sm">check</span>
        </div>
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-200">Mon</span>
      </div>

      <div class="flex flex-col items-center gap-2 group cursor-pointer">
        <div class="w-10 h-10 rounded-full bg-secondary border-4 border-white dark:border-surface-dark flex items-center justify-center shadow-md group-hover:scale-110 -mt-0.5 transition">
          <span class="material-icons-round text-white text-base">check</span>
        </div>
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-200">Tue</span>
      </div>

      <div class="flex flex-col items-center gap-2 group cursor-pointer">
        <div class="w-12 h-12 rounded-full bg-primary border-4 border-white dark:border-surface-dark flex items-center justify-center shadow-lg shadow-primary/30 -mt-1.5 ring-4 ring-primary/20 dark:ring-primary/10 group-hover:scale-110 transition">
          <div class="w-3 h-3 bg-white rounded-full animate-pulse"></div>
        </div>
        <span class="text-base font-bold text-primary dark:text-primary">Wed</span>
      </div>

      <div class="flex flex-col items-center gap-2 group cursor-pointer">
        <div class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-600 border-4 border-white dark:border-surface-dark flex items-center justify-center shadow-sm mt-0.5">
          <div class="w-2 h-2 bg-gray-400 dark:bg-gray-400 rounded-full"></div>
        </div>
        <span class="text-sm font-medium text-gray-400 dark:text-gray-500">Thu</span>
      </div>

      <div class="flex flex-col items-center gap-2 group cursor-pointer">
        <div class="w-7 h-7 rounded-full bg-gray-200 dark:bg-gray-600 border-4 border-white dark:border-surface-dark flex items-center justify-center shadow-sm mt-1">
          <div class="w-1.5 h-1.5 bg-gray-400 dark:bg-gray-400 rounded-full"></div>
        </div>
        <span class="text-sm font-medium text-gray-400 dark:text-gray-500">Fri</span>
      </div>

    </div>
  </div>

  <div class="mt-8 bg-green-50 dark:bg-primary/10 rounded-xl p-4 border border-green-100 dark:border-primary/20 flex items-start gap-3">
    <span class="material-icons-round text-primary text-xl mt-0.5">spa</span>
    <div>
      <p class="text-sm text-gray-700 dark:text-gray-300 font-medium">
        <span class="font-bold text-gray-900 dark:text-white">Tip of the day:</span>
        Consistency is key. Just 5 minutes of mindfulness today will help your plant grow stronger.
      </p>
    </div>
  </div>

</div>

<div class="mt-8 w-full pb-8">
  <button class="w-full bg-primary hover:bg-green-600 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-primary/40 transition transform active:scale-95 flex items-center justify-center gap-2">
    <span class="material-icons-round">edit_note</span>
    Journal Today's Growth
  </button>
</div>

</main>


<!-- ⭐ BOTTOM NAVIGATION (exact style from date.html) -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 w-full max-w-sm px-6">
  <div class="bg-white rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.12)] h-16 flex items-center justify-between px-10">

    <!-- HOME -->
    <a href="home.html"
       class="flex items-center justify-center w-8 h-8 text-navInactive hover:text-navActive transition-colors">
      <span class="material-symbols-outlined"
            style="font-variation-settings:'FILL' 1,'wght' 600,'opsz' 24; font-size:26px;">
        home
      </span>
    </a>

    <!-- CALENDAR -->
    <a href="date.html"
       class="flex items-center justify-center w-8 h-8 text-navInactive hover:text-navActive transition-colors">
      <span class="material-symbols-outlined"
            style="font-variation-settings:'FILL' 0,'wght' 600,'opsz' 24; font-size:26px;">
        calendar_today
      </span>
    </a>

    <!-- GROWTH (ACTIVE) -->
    <div class="flex items-center justify-center w-8 h-8 text-navActive">
      <span class="material-symbols-outlined"
            style="font-variation-settings:'FILL' 1,'wght' 600,'opsz' 24; font-size:26px;">
        spa
      </span>
    </div>

    <!-- PROFILE -->
    <a href="profile.html"
       class="flex items-center justify-center w-8 h-8 text-navInactive hover:text-navActive transition-colors">
      <span class="material-symbols-outlined"
            style="font-variation-settings:'FILL' 1,'wght' 600,'opsz' 24; font-size:26px;">
        person
      </span>
    </a>

  </div>
</div>

</body>
</html>
